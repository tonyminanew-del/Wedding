 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع المستندات كصور مباشرة - سر الإكليل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f4f6f9 0%, #e4e9f0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; color: #2c3e50; padding: 20px; }
        .container { background: #ffffff; padding: 40px 30px; border-radius: 22px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06); text-align: center; width: 100%; max-width: 520px; border-top: 5px solid #c5a059; }
        .cross-symbol { font-size: 34px; color: #c5a059; margin-bottom: 12px; background: #fdfcf7; width: 65px; height: 65px; line-height: 65px; border-radius: 50%; display: inline-block; box-shadow: 0 4px 10px rgba(197, 160, 89, 0.15); }
        h2 { color: #2c3e50; margin-bottom: 8px; font-size: 22px; font-weight: 700; }
        .subtitle { color: #7f8c8d; margin-bottom: 25px; font-size: 13px; }
        .form-group { margin-bottom: 20px; text-align: right; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #2c3e50; }
        .file-input-wrapper { background: #fafbfc; border: 2px dashed #cbd5e1; padding: 15px; border-radius: 10px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .file-input-wrapper:hover { border-color: #c5a059; background: #fdfcf7; }
        input[type="file"] { width: 100%; font-size: 13px; cursor: pointer; }
        .action-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: bold; cursor: pointer; transition: all 0.3s ease; background-color: #c5a059; color: white; margin-top: 10px; box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2); }
        .action-btn:hover { background-color: #b08d48; }
        .back-link { display: inline-block; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 13px; transition: color 0.3s; }
        .back-link:hover { color: #2c3e50; }
        #statusMessage { margin-top: 15px; font-size: 14px; font-weight: bold; word-break: break-word; }
    </style>
</head>
<body>

    <div class="container">
        <div class="cross-symbol">✝</div>
        <h2>رفع المستندات كصور مباشرة</h2>
        <p class="subtitle">سيتم حفظ الصور كبيانات مباشرة في قاعدة البيانات لإظهارها للكاهن</p>

        <div id="uploadForm">
            <div class="form-group">
                <label>1. صورة البطاقة الشخصية:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="idCardFile" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label>شهادة كورس المشوره:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="certificateFile" accept="image/*">
                </div>
            </div>

            <button class="action-btn" id="submitDocsBtn">حفظ وإرسال الصور ✝</button>
            <div id="statusMessage"></div>
        </div>

        <a href="home.html" class="back-link">⟵ العودة إلى لوحة المتابعة</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const submitDocsBtn = document.getElementById('submitDocsBtn');
        const statusMessage = document.getElementById('statusMessage');

        // دالة لتحويل ملف الصورة إلى Base64
        const convertFileToBinary = (file) => {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        };

        submitDocsBtn.addEventListener('click', async () => {
            const packageId = localStorage.getItem('userId');
            const idCardInput = document.getElementById('idCardFile');
            const certificateInput = document.getElementById('certificateFile');

            if (!packageId) {
                alert("خطأ: لم يتم العثور على حسابك المسجل، يرجى تسجيل الدخول مرة أخرى.");
                window.location.href = "index.html";
                return;
            }

            if (idCardInput.files.length === 0 || certificateInput.files.length === 0) {
                statusMessage.style.color = "#e74c3c";
                statusMessage.textContent = "الرجاء اختيار ملف البطاقة والشهادة معاً قبل الإرسال.";
                return;
            }

            submitDocsBtn.disabled = true;
            statusMessage.style.color = "#3498db";
            statusMessage.textContent = "جاري معالجة وتحويل الصور...";

            try {
                const idCardFile = idCardInput.files[0];
                const certificateFile = certificateInput.files[0];

                // تحويل الصورتين إلى بيانات ثنائية (Base64) لتخزينها مباشرة
                const idCardBase64 = await convertFileToBinary(idCardFile);
                const certificateBase64 = await convertFileToBinary(certificateFile);

                statusMessage.textContent = "جاري حفظ الصور في قاعدة البيانات...";

                const originalDocRef = doc(db, "WeddingPackages", packageId);
                const originalSnap = await getDoc(originalDocRef);

                let packageData = {};
                if (originalSnap.exists()) {
                    packageData = originalSnap.data();
                }

                // حفظ الصور المباشرة داخل كولكشن check
                const checkDocRef = doc(db, "check", packageId);
                await setDoc(checkDocRef, {
                    groom: packageData.groom || { fullName: "غير معروف" },
                    bride: packageData.bride || { fullName: "غير معروف" },
                    assignedPriest: packageData.assignedPriest || localStorage.getItem('assignedPriest') || "غير محدد",
                    documentsStatus: "قيد المراجعة",
                    idCardUrl: idCardBase64,         // سيتم تخزين بيانات الصورة الحقيقية هنا
                    certificateUrl: certificateBase64, // سيتم تخزين بيانات الشهادة الحقيقية هنا
                    submittedAt: new Date().toISOString()
                }, { merge: true });

                statusMessage.style.color = "#27ae60";
                statusMessage.textContent = "تم حفظ الصور وإرسالها بنجاح! جاري التحويل...";

                setTimeout(() => {
                    window.location.href = "main.html";
                }, 2000);

            } catch (error) {
                console.error("خطأ مفصل:", error);
                statusMessage.style.color = "#e74c3c";
                statusMessage.textContent = "فشل الحفظ: حجم الملف قد يكون كبيراً جداً (أكبر من 1 ميجابايت).";
                submitDocsBtn.disabled = false;
                submitDocsBtn.textContent = "حفظ وإرسال الصور ✝";
            }
        });
    </script>
</body>
</html>
