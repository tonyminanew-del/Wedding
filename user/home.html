<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة سر الإكليل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh; color: #2c3e50; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: right; border-top: 5px solid #c5a059; }
        .header-icon { text-align: center; font-size: 32px; color: #c5a059; margin-bottom: 10px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-size: 22px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }
        .info-box { background: #fdfcf7; border: 1.5px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; line-height: 1.8; }
        .info-box strong { color: #c5a059; }
        .action-btn { display: block; width: 100%; background-color: #2c3e50; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.3s; margin-top: 15px; }
        .action-btn:hover { background-color: #1a252f; }
        .appointment-btn { background-color: #27ae60 !important; display: none; margin-top: 10px; }
        .appointment-btn:hover { background-color: #219653 !important; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #eef2f7; color: #2980b9; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-icon">✝</div>
        <h2>لوحة متابعة سر الإكليل</h2>
        <p class="subtitle">متابعة تفاصيل الباقة وحالة المستندات ومواعيد الفرح</p>

        <div class="info-box" id="userInfoBox">
            <p><strong>رقم الطلب (ID):</strong> <span id="displayId">-</span></p>
            <p><strong>اسم العريس:</strong> <span id="displayGroom">لا توجد بيانات</span></p>
            <p><strong>اسم العروسة:</strong> <span id="displayBride">لا توجد بيانات</span></p>
            <p><strong>رقم الهاتف:</strong> <span id="displayPhone">لا توجد بيانات</span></p>
            <p><strong>حالة المستندات:</strong> <span class="status-badge" id="displayDocStatus">غير متوفر</span></p>
        </div>

        <a href="documents.html" class="action-btn">رفع أو تعديل المستندات 📄</a>
        
        <a href="clock.html" class="action-btn appointment-btn" id="appointmentBtn">📅 اضغط هنا لاختيار موعد الإكليل (تم قبول الأوراق)</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            const statusBadge = document.getElementById('displayDocStatus');
            const appointmentBtn = document.getElementById('appointmentBtn');

            try {
                // جلب جميع المستندات من قاعدة بيانات فايبربيس مباشرة (مجموعة check)
                const querySnapshot = await getDocs(collection(db, "check"));

                // إذا كانت قاعدة البيانات فارغة تماماً ولا تحتوي على أي مستندات
                if (querySnapshot.empty) {
                    document.getElementById('displayId').innerText = "-";
                    document.getElementById('displayGroom').innerText = "لا توجد بيانات";
                    document.getElementById('displayBride').innerText = "لا توجد بيانات";
                    document.getElementById('displayPhone').innerText = "لا توجد بيانات";
                    statusBadge.innerText = 'لا توجد بيانات';
                    statusBadge.style.backgroundColor = '#f8d7da';
                    statusBadge.style.color = '#721c24';
                    appointmentBtn.style.display = 'none';
                    return;
                }

                // إذا أردت جلب البيانات بناءً على مدخلات بحث أو إذا كان هناك مستند واحد محدد ترغب في إظهاره
                // كمثال، سنأخذ أول مستند حقيقي موجود في القاعدة فقط إذا وجد، أو يمكنك ربطه بصفحة تسجيل دخول
                let foundData = null;
                let foundId = null;

                querySnapshot.forEach((doc) => {
                    // هنا نقرأ المستندات المتاحة في قاعدة البيانات
                    foundId = doc.id;
                    foundData = doc.data();
                });

                if (foundData) {
                    document.getElementById('displayId').innerText = foundId;
                    document.getElementById('displayGroom').innerText = foundData.groom?.fullName || 'غير مسجل';
                    document.getElementById('displayBride').innerText = foundData.bride?.fullName || 'غير مسجل';
                    document.getElementById('displayPhone').innerText = foundData.phone || foundData.groom?.phone || 'غير متوفر';

                    const docStatus = foundData.documentsStatus || 'قيد المراجعة';
                    const cleanStatus = String(docStatus).trim().toLowerCase();

                    const isAccepted = 
                        cleanStatus.includes('قبول') || 
                        cleanStatus.includes('مقبول') || 
                        cleanStatus.includes('مقبولة') || 
                        cleanStatus.includes('accept') || 
                        cleanStatus.includes('approved');

                    if (isAccepted) {
                        statusBadge.innerText = 'مقبولة ✅';
                        statusBadge.style.backgroundColor = '#d4edda';
                        statusBadge.style.color = '#155724';
                        appointmentBtn.style.display = 'block';
                    } else {
                        statusBadge.innerText = docStatus;
                        statusBadge.style.backgroundColor = '#f8d7da';
                        statusBadge.style.color = '#721c24';
                        appointmentBtn.style.display = 'none';
                    }
                } else {
                    document.getElementById('displayId').innerText = "-";
                    document.getElementById('displayGroom').innerText = "لا توجد بيانات";
                    document.getElementById('displayBride').innerText = "لا توجد بيانات";
                    document.getElementById('displayPhone').innerText = "لا توجد بيانات";
                    statusBadge.innerText = 'لا توجد بيانات';
                    statusBadge.style.backgroundColor = '#f8d7da';
                    statusBadge.style.color = '#721c24';
                    appointmentBtn.style.display = 'none';
                }

            } catch (error) {
                console.error("خطأ في الاتصال بقاعدة البيانات:", error);
                statusBadge.innerText = "خطأ في الاتصال";
            }
        });
    </script>
</body>
</html>
