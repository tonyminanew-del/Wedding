<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة متابعة سر الإكليل</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%); min-height: 100vh; color: #2c3e50; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card { background: #ffffff; width: 100%; max-width: 500px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: right; border-top: 5px solid #c5a059; }
        .header-icon { text-align: center; font-size: 32px; color: #c5a059; margin-bottom: 10px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 5px; font-size: 22px; }
        p.subtitle { text-align: center; color: #7f8c8d; font-size: 13px; margin-bottom: 25px; }
        .info-box { background: #fdfcf7; border: 1.5px solid #e9ecef; padding: 15px; border-radius: 12px; margin-bottom: 15px; font-size: 14px; line-height: 1.8; }
        .info-box strong { color: #c5a059; }
        .action-btn { display: block; width: 100%; background-color: #2c3e50; color: white; border: none; padding: 12px; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; transition: background 0.3s; margin-top: 15px; }
        .action-btn:hover { background-color: #1a252f; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; background: #eef2f7; color: #2980b9; }
        .logout-btn { display: block; text-align: center; margin-top: 20px; color: #e74c3c; text-decoration: none; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header-icon">✝</div>
        <h2>لوحة متابعة سر الإكليل</h2>
        <p class="subtitle">متابعة تفاصيل الباقة وحالة المستندات ومواعيد الفرح</p>

        <div class="info-box" id="userInfoBox">
            <p><strong>معرف الحزمة (ID):</strong> <span id="displayId">جاري التحميل...</span></p>
            <p><strong>اسم العريس:</strong> <span id="displayGroom">جاري التحميل...</span></p>
            <p><strong>اسم العروسة:</strong> <span id="displayBride">جاري التحميل...</span></p>
            <p><strong>رقم الهاتف:</strong> <span id="displayPhone">جاري التحميل...</span></p>
            <p><strong>حالة المستندات:</strong> <span class="status-badge" id="displayDocStatus">قيد المراجعة</span></p>
        </div>

        <a href="upload.html" class="action-btn">رفع المستندات والأوراق المطلوبة 📄</a>
        <a href="../index.html" class="logout-btn">تسجيل الخروج ⟵</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', async () => {
            // جلب معرف المستند المخزن أثناء تسجيل الدخول أو التسجيل
            const userCode = localStorage.getItem('userCode') || localStorage.getItem('docId');

            if (!userCode) {
                alert("يرجى تسجيل الدخول أولاً.");
                window.location.href = "../index.html";
                return;
            }

            document.getElementById('displayId').innerText = userCode;

            try {
                // البحث في مجموعة check أو ChurchUsers بناءً على الـ ID
                const docRef = doc(db, "check", userCode);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // جلب البيانات مع دعم الاحتمالات المختلفة لتسمية الحقول
                    const groomName = (data.groom && data.groom.fullName) ? data.groom.fullName : (data.fullName || 'غير مسجل');
                    const brideName = (data.bride && data.bride.fullName) ? data.bride.fullName : (data.brideName || 'غير مسجل');
                    const phoneNum = data.phone || (data.groom && data.groom.phone) || 'غير متوفر';
                    const docStatus = data.documentsStatus || 'قيد المراجعة';

                    document.getElementById('displayGroom').innerText = groomName;
                    document.getElementById('displayBride').innerText = brideName;
                    document.getElementById('displayPhone').innerText = phoneNum;
                    document.getElementById('displayDocStatus').innerText = docStatus;
                } else {
                    // محاولة البحث في مجموعة ChurchUsers إذا لم توجد في check
                    const altDocRef = doc(db, "ChurchUsers", userCode);
                    const altSnap = await getDoc(altDocRef);
                    if (altSnap.exists()) {
                        const altData = altSnap.data();
                        document.getElementById('displayGroom').innerText = altData.fullName || 'غير مسجل';
                        document.getElementById('displayPhone').innerText = altData.phone || 'غير متوفر';
                        document.getElementById('displayBride').innerText = altData.brideName || 'غير مسجل';
                    } else {
                        document.getElementById('userInfoBox').innerHTML = `<p style="color: #e74c3c; text-align: center;">لم يتم العثور على بيانات لهذا الحساب في قاعدة البيانات.</p>`;
                    }
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات المستخدم:", error);
            }
        });
    </script>
</body>
</html>
