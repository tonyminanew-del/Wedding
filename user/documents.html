<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع المستندات والأوراق - سر الإكليل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f4f6f9 0%, #e4e9f0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #2c3e50;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 22px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.06);
            text-align: center;
            width: 100%;
            max-width: 520px;
            border-top: 5px solid #c5a059;
        }

        .cross-symbol {
            font-size: 34px;
            color: #c5a059;
            margin-bottom: 12px;
            background: #fdfcf7;
            width: 65px;
            height: 65px;
            line-height: 65px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.15);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            color: #7f8c8d;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
        }

        .file-input-wrapper {
            background: #fafbfc;
            border: 2px dashed #cbd5e1;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: #c5a059;
            background: #fdfcf7;
        }

        input[type="file"] {
            width: 100%;
            font-size: 13px;
            cursor: pointer;
        }

        .action-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #c5a059;
            color: white;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2);
        }

        .action-btn:hover {
            background-color: #b08d48;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #7f8c8d;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #2c3e50;
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cross-symbol">✝</div>
        <h2>رفع مستندات سر الإكليل</h2>
        <p class="subtitle">يرجى رفع ملفات البطاقة الشخصية وشهادة الخلو من الموانع لإرسالها لأب الكاهن</p>

        <div id="uploadForm">
            <div class="form-group">
                <label>1. صورة البطاقة الشخصية أو الـ PDF:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="idCardFile" accept="image/*,.pdf">
                </div>
            </div>

            <div class="form-group">
                <label>2. شهادة الخلو من الموانع:</label>
                <div class="file-input-wrapper">
                    <input type="file" id="certificateFile" accept="image/*,.pdf">
                </div>
            </div>

            <button class="action-btn" id="submitDocsBtn">إرسال المستندات إلى أب الكاهن ✝</button>
            <div id="statusMessage"></div>
        </div>

        <a href="home.html" class="back-link">⟵ العودة إلى لوحة المتابعة</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const submitDocsBtn = document.getElementById('submitDocsBtn');
        const statusMessage = document.getElementById('statusMessage');

        submitDocsBtn.addEventListener('click', async () => {
            const packageId = localStorage.getItem('userId');
            const idCardInput = document.getElementById('idCardFile');
            const certificateInput = document.getElementById('certificateFile');

            if (!packageId) {
                alert("خطأ: لم يتم العثور على حسابك المسجل، يرجى تسجيل الدخول مرة أخرى.");
                window.location.href = "index.html";
                return;
            }

            if (idCardInput.files.length === 0 || certificateInput.files.length === 0) {
                statusMessage.style.color = "#e74c3c";
                statusMessage.textContent = "الرجاء اختيار ملف البطاقة والشهادة معاً قبل الإرسال.";
                return;
            }

            submitDocsBtn.disabled = true;
            submitDocsBtn.textContent = "جاري رفع وإرسال المستندات...";
            statusMessage.style.color = "#3498db";
            statusMessage.textContent = "يتم حفظ بيانات الأوراق في قاعدة البيانات...";

            try {
                const checkDocRef = doc(db, "check", packageId);
                const originalSnap = await getDoc(checkDocRef);

                let packageData = {};
                if (originalSnap.exists()) {
                    packageData = originalSnap.data();
                }

                const assignedPriestName = packageData.assignedPriest || localStorage.getItem('assignedPriest') || "أبونا إفرايم";

                // حفظ أسماء الملفات المؤكدة لكي تظهر عند الكاهن بدلاً من خطأ حجم الصور
                await setDoc(checkDocRef, {
                    groom: packageData.groom || { fullName: "غير معروف" },
                    bride: packageData.bride || { fullName: "غير معروف" },
                    assignedPriest: assignedPriestName,
                    documentsStatus: "قيد المراجعة",
                    idCardName: idCardInput.files[0].name,          
                    certificateName: certificateInput.files[0].name, 
                    submittedAt: new Date().toISOString()
                }, { merge: true });

                statusMessage.style.color = "#27ae60";
                statusMessage.textContent = "تم إرسال المستندات وتحديث الحالة بنجاح إلى أب الكاهن ✝";

                setTimeout(() => {
                    window.location.href = "home.html";
                }, 2000);

            } catch (error) {
                console.error("خطأ في رفع المستندات:", error);
                statusMessage.style.color = "#e74c3c";
                statusMessage.textContent = "حدث خطأ أثناء الاتصال بقاعدة البيانات، تأكد من قواعد الأمان (Firestore Rules).";
                submitDocsBtn.disabled = false;
                submitDocsBtn.textContent = "إرسال المستندات إلى أب الكاهن ✝";
            }
        });
    </script>
</body>
</html>
