<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التواصل عبر الواتساب</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f4f6f9 0%, #e4e9f0 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            color: #2c3e50; 
            padding: 15px; 
        }

        .redirect-container { 
            background: #ffffff; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 420px; 
            border-top: 5px solid #27ae60; 
            text-align: center;
        }

        .cross-symbol { 
            font-size: 28px; 
            color: #c5a059; 
            background: #fdfcf7; 
            width: 60px; 
            height: 60px; 
            line-height: 60px; 
            border-radius: 50%; 
            box-shadow: 0 4px 12px rgba(197, 160, 89, 0.2); 
            margin: 0 auto 20px auto;
        }

        h2 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            font-size: 13.5px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .whatsapp-btn { 
            display: inline-block; 
            width: 100%;
            background-color: #27ae60; 
            color: white; 
            text-decoration: none; 
            padding: 12px; 
            border-radius: 14px; 
            font-size: 15px; 
            font-weight: 600;
            transition: all 0.2s; 
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.3);
        }
        
        .whatsapp-btn:hover { 
            background-color: #219653; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="cross-symbol">✝</div>
        <h2>جاري تحويلك إلى الواتساب...</h2>
        <p>إذا لم يتم التحويل تلقائياً خلال لحظات، يرجى الضغط على الزر أدناه للتواصل المباشر.</p>
        <a href="https://wa.me/201203821961" id="waLink" class="whatsapp-btn" target="_blank">💬 اضغط هنا للتواصل عبر الواتساب</a>
    </div>

    <script>
        // فتح الواتساب تلقائياً فور تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            const whatsappUrl = "https://wa.me/201203821961";
            
            // فتح الرابط في نافذة جديدة أو في نفس التبويب حسب المتصفح
            setTimeout(() => {
                window.location.href = whatsappUrl;
            }, 800); // تأخير بسيط 0.8 ثانية ليتمكن المستخدم من رؤية رسالة التوجيه
        });
    </script>
</body>
</html>
