<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد الإكليل / الخطوبة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background: linear-gradient(135deg, #f4f6f9 0%, #e4e9f0 100%); 
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px; 
            color: #2c3e50; 
        }

        .booking-container { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 480px; 
            border-top: 5px solid #c5a059; 
        }

        .cross-symbol { 
            font-size: 24px; 
            color: #c5a059; 
            background: #fdfcf7; 
            width: 50px; 
            height: 50px; 
            line-height: 50px; 
            border-radius: 50%; 
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.2); 
            text-align: center;
            margin: 0 auto 15px auto;
        }

        h2 {
            text-align: center;
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #475569;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 12px;
            font-size: 13.5px;
            outline: none;
            transition: all 0.3s;
            background: #f8fafc;
        }

        input:focus {
            border-color: #c5a059;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(197, 160, 89, 0.12);
        }

        .price-box {
            background: #fdfcf7;
            border: 1.5px dashed #c5a059;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #c5a059;
            margin: 15px 0;
        }

        .ok-btn { 
            width: 100%;
            background-color: #27ae60; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            transition: all 0.2s; 
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.25);
            text-align: center;
        }
        
        .ok-btn:hover { 
            background-color: #219653; 
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <div class="cross-symbol">✝</div>
        <h2>بيانات حجز الموعد</h2>

        <div class="form-group">
            <label>اسم العريس:</label>
            <input type="text" id="groomName" placeholder="أدخل اسم العريس ثلاثي">
        </div>

        <div class="form-group">
            <label>رقم هاتف العريس:</label>
            <input type="tel" id="groomPhone" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
            <label>اسم العروسة (الخطيبة):</label>
            <input type="text" id="brideName" placeholder="أدخل اسم العروسة ثلاثي">
        </div>

        <div class="form-group">
            <label>تاريخ الموعد:</label>
            <input type="date" id="bookingDate">
        </div>

        <div class="form-group">
            <label>وقت الموعد (الساعة):</label>
            <input type="time" id="bookingTime">
        </div>

        <div class="price-box">
            رسوم الحجز الكلية: 500 جنيه مصري
        </div>

        <button class="ok-btn" id="okBtn">OK - تأكيد الحجز وإرسال للواتساب</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ضبط أقل تاريخ يمكن اختياره ليصبح هو تاريخ اليوم (لمنع اختيار أيام مضت)
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('bookingDate').min = todayStr;

        const okBtn = document.getElementById('okBtn');

        okBtn.addEventListener('click', async () => {
            const groomName = document.getElementById('groomName').value.trim();
            const groomPhone = document.getElementById('groomPhone').value.trim();
            const brideName = document.getElementById('brideName').value.trim();
            const bookingDate = document.getElementById('bookingDate').value;
            const bookingTime = document.getElementById('bookingTime').value;

            // التحقق من اكتمال البيانات
            if (!groomName || !groomPhone || !brideName || !bookingDate || !bookingTime) {
                alert("يرجى ملء جميع البيانات بشكل صحيح.");
                return;
            }

            // التحقق من أن التاريخ ليس في الماضي
            const selectedDateTime = new Date(`${bookingDate}T${bookingTime}`);
            const now = new Date();

            if (selectedDateTime < now) {
                alert("عذراً، لا يمكن اختيار تاريخ أو وقت قديم/منقضٍ.");
                return;
            }

            // التحقق في قاعدة البيانات عما إذا كان هذا الموعد محجوزاً مسبقاً من شخص آخر
            try {
                okBtn.disabled = true;
                okBtn.textContent = "جاري التحقق من الموعد...";

                const querySnapshot = await getDocs(collection(db, "WeddingPackages"));
                let isAlreadyTaken = false;

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    // إذا وجدنا حجزاً بنفس التاريخ والوقت المدخل
                    if (data.date === bookingDate && data.time === bookingTime) {
                        isAlreadyTaken = true;
                    }
                });

                if (isAlreadyTaken) {
                    alert("عذراً، هذا الموعد (التاريخ والساعة) محجوز بالفعل لشخص آخر. يرجى اختيار موعد آخر.");
                    okBtn.disabled = false;
                    okBtn.textContent = "OK - تأكيد الحجز وإرسال للواتساب";
                    return;
                }

                // إذا كان الموعد متاحاً، يتم تجهيز رسالة الواتساب وتوجيه المستخدم
                const whatsappNumber = "201203821961";
                const message = `مرحباً، أرغب في تأكيد حجز موعد جديد بالدقة التالية:
- اسم العريس: ${groomName}
- رقم هاتف العريس: ${groomPhone}
- اسم العروسة (الخطيبة): ${brideName}
- تاريخ الموعد: ${bookingDate}
- وقت الموعد: ${bookingTime}
- رسوم الحجز: 500 جنيه`;

                const encodedMessage = encodeURIComponent(message);
                const whatsappUrl = `https://wa.me/${whatsappNumber}?text=${encodedMessage}`;

                window.location.href = whatsappUrl;

            } catch (error) {
                console.error("خطأ في التحقق من الحجوزات:", error);
                alert("حدث خطأ أثناء التحقق من الموعد، يرجى المحاولة مرة أخرى.");
                okBtn.disabled = false;
                okBtn.textContent = "OK - تأكيد الحجز وإرسال للواتساب";
            }
        });
    </script>
</body>
</html>
