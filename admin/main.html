<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم أب الكاهن - سر الإكليل</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #2c3e50;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .navbar {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            padding: 15px 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-top: 4px solid #c5a059;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 17px;
            font-weight: 700;
            color: #2c3e50;
        }

        .nav-brand span {
            color: #c5a059;
            font-size: 22px;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-card {
            background: linear-gradient(135deg, #2c3e50 0%, #1a252f 100%);
            color: #ffffff;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(44, 62, 80, 0.15);
            text-align: right;
        }

        .welcome-card h1 {
            font-size: 26px;
            margin-bottom: 8px;
            color: #f39c12;
        }

        .welcome-card p {
            font-size: 14px;
            color: #bdc3c7;
        }

        .section-box {
            background: #ffffff;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            text-align: right;
        }

        .section-box h3 {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .request-row-summary {
            background: #fafbfc;
            border: 1.5px solid #e9ecef;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .request-row-summary:hover {
            border-color: #c5a059;
            background: #fff;
        }

        .summary-info h4 {
            font-size: 15px;
            color: #2c3e50;
            margin-bottom: 4px;
        }

        .summary-info p {
            font-size: 13px;
            color: #7f8c8d;
        }

        .link-details-btn {
            background-color: #c5a059;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .link-details-btn:hover {
            background-color: #b08d48;
        }

        #detailsModal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: right;
            position: relative;
        }

        .close-modal {
            position: absolute;
            left: 20px;
            top: 20px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-section {
            background: #fdfcf7;
            border: 1px dashed #c5a059;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .action-row-modal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f4f6f9;
            padding: 12px 15px;
            border-radius: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-accept {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-accept:hover { background-color: #219653; }

        .btn-reject {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 7px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-reject:hover { background-color: #c0392b; }

        #imageModal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #modalImg {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 8px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        #closeImgBtn {
            margin-top: 15px;
            background: #c5a059;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            color: #888;
            padding: 30px;
            font-size: 14px;
        }

        .logout-btn {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #e74c3c;
            text-decoration: none;
            font-size: 13px;
            font-weight: 650;
        }
    </style>
</head>
<body>

    <div id="imageModal" onclick="closeImageModal()">
        <img id="modalImg" src="">
        <button id="closeImgBtn" onclick="closeImageModal()">إغلاق المعاينة ✕</button>
    </div>

    <div id="detailsModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeDetailsModal()">✕</button>
            <h2 style="color: #c5a059; margin-bottom: 15px;">تفاصيل الطلب الشاملة ✝</h2>
            <div id="modalBodyContent"></div>
        </div>
    </div>

    <div class="navbar">
        <div class="nav-brand">
            <span>✝</span> كهنة كنيسة الشهيد العظيم مارجرجس
        </div>
    </div>

    <div class="main-container">
        <div class="welcome-card">
            <h1 id="priestGreeting">أهلاً بك يا أبونا...</h1>
            <p>قائمة الطلبات تظهر بشكل مبسط ومضغوط، اضغط على "عرض تفاصيل الطلب" لإظهار المستندات والقرارات.</p>
        </div>

        <div class="section-box">
            <h3>
                <span>قائمة الطلبات الواردة (photo)</span>
                <span style="font-size: 13px; color: #7f8c8d; font-weight: normal;" id="totalCount">جاري العد...</span>
            </h3>
            
            <div id="checkCollectionList">
                <div class="no-data">جاري جلب الطلبات...</div>
            </div>
        </div>

        <a href="../index.html" class="logout-btn">تسجيل الخروج ⟵</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where, doc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBJTnK89_MsJl7eMY99BdbRTHKtWinlK7g",
          authDomain: "wedding-34f49.firebaseapp.com",
          projectId: "wedding-34f49",
          storageBucket: "wedding-34f49.firebasestorage.app",
          messagingSenderId: "1071878294617",
          appId: "1:1071878294617:web:5e7138d17a3aa78366f548",
          measurementId: "G-69VMQJT1Z8"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let globalRequestsData = {};
        let currentAssignedPriest = "";

        window.addEventListener('DOMContentLoaded', async () => {
            currentAssignedPriest = localStorage.getItem('assignedPriest');
            const greetingElement = document.getElementById('priestGreeting');
            const listContainer = document.getElementById('checkCollectionList');
            const totalCountElement = document.getElementById('totalCount');

            if (!currentAssignedPriest) {
                window.location.href = "../index.html";
                return;
            }

            greetingElement.innerText = "أهلاً بك يا أبونا، " + currentAssignedPriest + " ✝";

            try {
                // جلب الطلبات من كولكشن photo الجديد
                const q = query(collection(db, "photo"), where("assignedPriest", "==", currentAssignedPriest));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    listContainer.innerHTML = `<div class="no-data">لا توجد طلبات مسجلة معك في قسم photo حالياً.</div>`;
                    totalCountElement.innerText = "الإجمالي: 0 طلب";
                } else {
                    let htmlContent = "";
                    let count = 0;

                    querySnapshot.forEach((docSnap) => {
                        const data = docSnap.data();
                        const docId = docSnap.id;
                        globalRequestsData[docId] = data;
                        count++;

                        const groomName = (data.groom && data.groom.fullName) ? data.groom.fullName : 'غير مسجل';
                        const brideName = (data.bride && data.bride.fullName) ? data.bride.fullName : 'غير مسجل';
                        const docStatus = data.documentsStatus || 'قيد المراجعة';

                        htmlContent += `
                            <div class="request-row-summary" id="row-${docId}">
                                <div class="summary-info">
                                    <h4>${groomName} & ${brideName}</h4>
                                    <p>رقم الطلب: ${docId} | الأوراق: <span style="color: #c5a059; font-weight: bold;">${docStatus}</span></p>
                                </div>
                                <button class="link-details-btn" onclick="openRequestDetails('${docId}')">عرض تفاصيل الطلب 📋</button>
                            </div>
                        `;
                    });

                    listContainer.innerHTML = htmlContent;
                    totalCountElement.innerText = `الإجمالي: ${count} طلب`;
                }
            } catch (error) {
                console.error("خطأ في جلب بيانات photo:", error);
                listContainer.innerHTML = `<div class="no-data" style="color: #e74c3c;">حدث خطأ أثناء تحميل البيانات.</div>`;
            }
        });

        window.openRequestDetails = function(docId) {
            const data = globalRequestsData[docId];
            if (!data) return;

            const modalBody = document.getElementById('modalBodyContent');
            const groomName = (data.groom && data.groom.fullName) ? data.groom.fullName : 'غير مسجل';
            const brideName = (data.bride && data.bride.fullName) ? data.bride.fullName : 'غير مسجل';
            const docStatus = data.documentsStatus || 'قيد المراجعة';
            const apptStatus = data.appointmentStatus || 'غير محدد';
            const selectedDate = data.selectedAppointment || data.appointmentDate || 'لم يتم اختيار موعد';

            const docActionInfo = data.documentsActionBy ? `<br><span style="color:#27ae60; font-size:11px;">بواسطة الأب: ${data.documentsActionBy} (${data.documentsActionTime || ''})</span>` : '';
            const apptActionInfo = data.appointmentActionBy ? `<br><span style="color:#27ae60; font-size:11px;">بواسطة الأب: ${data.appointmentActionBy} (${data.appointmentActionTime || ''})</span>` : '';

            modalBody.innerHTML = `
                <p style="margin-bottom: 8px;"><strong>رقم الطلب (ID):</strong> ${docId}</p>
                <p style="margin-bottom: 8px;"><strong>العريس:</strong> ${groomName}</p>
                <p style="margin-bottom: 8px;"><strong>العروسة:</strong> ${brideName}</p>
                
                <div style="margin-top: 10px;">
                    <p style="font-size: 13px;"><strong>حالة الأوراق:</strong> <span id="modal-doc-status-${docId}" style="color: #c5a059; font-weight: bold;">${docStatus}</span> ${docActionInfo}</p>
                    <p style="font-size: 13px; margin-top: 6px;"><strong>حالة الموعد:</strong> <span id="modal-appt-status-${docId}" style="color: #2980b9; font-weight: bold;">${apptStatus}</span> ${apptActionInfo}</p>
                    <p style="font-size: 12px; color: #555; margin-top: 4px;"><strong>الموعد المقترح:</strong> ${selectedDate}</p>
                </div>

                <div class="modal-section">
                    <p style="font-size: 13px; color: #555; margin-bottom: 8px; font-weight: bold;">📋 معاينة المستندات (اضغط على الصورة للتكبير):</p>
                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
                        <div>
                            <p style="font-size: 11px; margin-bottom: 3px;">صورة البطاقة:</p>
                            ${data.idCardUrl ? `<img src="${data.idCardUrl}" style="width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1.5px solid #c5a059; cursor: pointer;" onclick="openImageModal('${data.idCardUrl}')">` : '<span style="font-size:11px; color:#e74c3c;">لم تُرفع</span>'}
                        </div>
                        <div>
                            <p style="font-size: 11px; margin-bottom: 3px;">شهادة الخلو:</p>
                            ${data.certificateUrl ? `<img src="${data.certificateUrl}" style="width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1.5px solid #c5a059; cursor: pointer;" onclick="openImageModal('${data.certificateUrl}')">` : '<span style="font-size:11px; color:#e74c3c;">لم تُرفع</span>'}
                        </div>
                    </div>
                </div>

                <div style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 12px;">
                    <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">📄 قرار الأوراق:</p>
                    <div class="action-row-modal">
                        <span>تحديث حالة الأوراق:</span>
                        <div class="btn-group">
                            <button class="btn-accept" onclick="updateField('${docId}', 'documentsStatus', 'مقبولة')">قبول الورق ✅</button>
                            <button class="btn-reject" onclick="updateField('${docId}', 'documentsStatus', 'مرفوضة')">رفض الورق ❌</button>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 12px;">
                    <p style="font-size: 13px; font-weight: bold; margin-bottom: 5px;">📌 قرار الموعد:</p>
                    <div class="action-row-modal">
                        <span>تحديث حالة الموعد:</span>
                        <div class="btn-group">
                            <button class="btn-accept" onclick="updateField('${docId}', 'appointmentStatus', 'ميعاد مقبول')">قبول الموعد ✅</button>
                            <button class="btn-reject" onclick="updateField('${docId}', 'appointmentStatus', 'ميعاد مرفوض')">رفض الموعد ❌</button>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('detailsModal').style.display = 'flex';
        }

        window.closeDetailsModal = function() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        window.openImageModal = function(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = url;
            modal.style.display = 'flex';
        }

        window.closeImageModal = function() {
            const modal = document.getElementById('imageModal');
            modal.style.display = 'none';
        }

        window.updateField = async function(docId, fieldName, value) {
            try {
                const now = new Date();
                const timeString = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                
                let updateData = {
                    [fieldName]: value
                };

                if (fieldName === 'documentsStatus') {
                    updateData.documentsActionBy = currentAssignedPriest;
                    updateData.documentsActionTime = timeString;
                    globalRequestsData[docId].documentsActionBy = currentAssignedPriest;
                    globalRequestsData[docId].documentsActionTime = timeString;
                } else if (fieldName === 'appointmentStatus') {
                    updateData.appointmentActionBy = currentAssignedPriest;
                    updateData.appointmentActionTime = timeString;
                    globalRequestsData[docId].appointmentActionBy = currentAssignedPriest;
                    globalRequestsData[docId].appointmentActionTime = timeString;
                }

                // التحديث يتم داخل كولكشن photo
                const docRef = doc(db, "photo", docId);
                await updateDoc(docRef, updateData);
                
                globalRequestsData[docId][fieldName] = value;

                if (fieldName === 'documentsStatus') {
                    const span = document.getElementById(`modal-doc-status-${docId}`);
                    if (span) span.innerText = value;
                } else if (fieldName === 'appointmentStatus') {
                    const span = document.getElementById(`modal-appt-status-${docId}`);
                    if (span) span.innerText = value;
                }

                alert("تم التحديث بنجاح بواسطة الأب: " + currentAssignedPriest);
            } catch (error) {
                console.error("خطأ في التحديث:", error);
                alert("حدث خطأ أثناء حفظ التحديث في قاعدة البيانات.");
            }
        };
    </script>
</body>
</html>
